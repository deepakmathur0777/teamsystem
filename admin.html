<!DOCTYPE html>
<html>
<head>
<title>Admin Control Panel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#1e3a8a,#07122a);
  color:#e5e7eb;
  min-height:100vh;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,#0d1b3a,#1e3a8a);
  padding:22px 26px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  margin-bottom:25px;
}

.hero h1{font-size:26px;}
.hero-sub{opacity:.75;margin-top:6px;}

.switch-btn{
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:white;
  padding:6px 14px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
  margin-left:10px;
}

/* ===== STATS ===== */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:25px;
}

.card{
  background:#0d1b3a;
  padding:18px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
  transition:.25s;
}
.card:hover{transform:translateY(-4px);}

.card h2{
  color:#38bdf8;
  font-size:28px;
}
.card p{
  opacity:.7;
  font-size:13px;
}

/* ===== SECTION ===== */
.section-title{
  font-size:20px;
  margin:25px 0 12px;
}

/* ===== MEMBER GRID ===== */
#memberOverview{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}

.member-card{
  background:#0d1b3a;
  padding:14px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}

.member-card h3{margin-bottom:6px;}

.good{color:#22c55e;}
.medium{color:#f59e0b;}
.bad{color:#ef4444;}

/* ===== LEADERBOARD ===== */
#leaderboard{
  display:flex;
  gap:14px;
  margin-bottom:20px;
}

.leader-card{
  flex:1;
  background:#0d1b3a;
  padding:14px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<div class="container">

<!-- HERO -->
<div class="hero">
  <div>
    <h1>🛠 Admin Control Panel</h1>
    <p class="hero-sub">
      Monitor team productivity and task performance
    </p>
  </div>

  <div>
    <a href="dashboard.html" class="switch-btn">👥 Team</a>
    <a href="assign.html" class="switch-btn">📋 Assign</a>
    <a href="personal.html" class="switch-btn">👤 Personal</a>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="card">
    <h2 id="totalMembers">0</h2>
    <p>Total Members</p>
  </div>

  <div class="card">
    <h2 id="totalOverdue">0</h2>
    <p>Total Overdue Tasks</p>
  </div>

  <div class="card">
    <h2 id="lowPerformers">0</h2>
    <p>Needs Attention</p>
  </div>

  <div class="card">
    <h2 id="dueToday">0</h2>
    <p>Tasks Due Today</p>
  </div>

  <div class="card">
    <h2 id="longPending">0</h2>
    <p>Long Pending Tasks</p>
  </div>
</div>

<!-- LEADERBOARD -->
<h2 class="section-title">🥇 Top Performers</h2>
<div id="leaderboard"></div>

<!-- MEMBERS -->
<h2 class="section-title">Member Work Status</h2>
<div id="memberOverview"></div>

</div>

<script type="module" src="admin.js"></script>
</body>
</html>
