<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background:#0f172a;
      color:white;
      font-family:Arial;
      margin:0;
    }

    .container {
      max-width:1100px;
      margin:auto;
      padding:40px;
    }

    .section {
      background:#1e293b;
      padding:25px;
      border-radius:12px;
      margin-bottom:30px;
    }

    h2 { margin-top:0; }

    button {
      padding:6px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
      margin-right:6px;
    }

    .promote { background:#16a34a; color:white; }
    .demote { background:#f59e0b; color:white; }
    .remove { background:#ef4444; color:white; }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th, td {
      padding:10px;
      border-bottom:1px solid #334155;
    }

    input, select {
      padding:5px;
      border-radius:5px;
      border:none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Project Admin Panel</h1>

  <!-- MEMBERS SECTION -->
  <div class="section">
    <h2>Members</h2>
    <div id="membersContainer"></div>
  </div>

  <!-- TASKS SECTION -->
  <div class="section">
    <h2>Manage Tasks</h2>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Assigned</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tasksContainer"></tbody>
    </table>
  </div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
