<!DOCTYPE html>
<html>
<head>
<title>My Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#0f1e44,#07122a);
  color:#e5e7eb;
}

/* ===== GLOBAL ===== */
.container{
  padding:20px;
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:18px;
}

/* ===== HEADER ===== */
.top-bar{
  grid-column:1/span 2;
  background:linear-gradient(135deg,#0d1b3a,#1e3a8a);
  padding:14px 18px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.top-bar h2{
  font-weight:600;
  letter-spacing:.4px;
}

/* BUTTONS */
.switch-btn, .toggle-btn{
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none;
  padding:6px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
  text-decoration:none;
  font-size:13px;
  margin-left:10px;
  transition:.25s;
}
.switch-btn:hover,
.toggle-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.35);
}

/* ===== HERO ===== */
.hero{
  grid-column:1/span 2;
  background:#0d1b3a;
  padding:18px 20px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.hero-metric{
  font-size:34px;
  font-weight:600;
  color:#22c55e;
}
.hero-status{
  font-size:13px;
  opacity:.75;
}

/* ===== STATS ===== */
.stats{
  grid-column:1/span 2;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.card{
  background:#0d1b3a;
  padding:14px;
  border-radius:14px;
  text-align:center;
  transition:.25s;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}

.card:hover{
  transform:translateY(-4px);
}

.card h2{
  color:#38bdf8;
  font-size:24px;
}
.card p{
  opacity:.7;
  font-size:12px;
}

/* ===== TABLE ===== */
.table-section{
  background:#0d1b3a;
  border-radius:14px;
  padding:14px;
  overflow:auto;
  max-height:70vh;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  background:#162447;
  padding:10px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #162447;
}

tr:hover{
  background:#14213d;
}

/* ===== SIDE ===== */
.side{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.chart-card{
  background:#0d1b3a;
  border-radius:14px;
  padding:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.chart-card canvas{
  height:180px !important;
}

/* ===== SMALL DETAILS ===== */
.section-title{
  margin-bottom:8px;
  font-weight:600;
  opacity:.9;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="top-bar">
  <h2 id="welcomeText">My Dashboard</h2>
  <div>
    <a href="dashboard.html" class="switch-btn">👥 Team Dashboard</a>
    <button onclick="logout()" class="toggle-btn">Logout</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div>
    <div class="hero-metric">
      <span id="myCompletionRate">0%</span>
    </div>
    <p id="myStatusText" class="hero-status">
      Loading your performance...
    </p>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="card"><h2 id="myTotal">0</h2><p>Total Tasks</p></div>
  <div class="card"><h2 id="myCompleted">0</h2><p>Completed</p></div>
  <div class="card"><h2 id="myPending">0</h2><p>Pending</p></div>
  <div class="card"><h2 id="myOverdue">0</h2><p>Overdue</p></div>
</div>

<!-- TABLE -->
<div class="table-section">
  <div class="section-title">My Tasks</div>
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Deadline</th>
        <th>Update</th>
      </tr>
    </thead>
    <tbody id="taskTable"></tbody>
  </table>
</div>

<!-- SIDE -->
<div class="side">

  <div class="chart-card">
    <div class="section-title">My Progress</div>
    <canvas id="myChart"></canvas>
  </div>

</div>

</div>

<script type="module" src="personal.js"></script>
</body>
</html>
