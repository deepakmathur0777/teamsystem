<!DOCTYPE html>
<html>
<head>
  <title>Workspaces | HireLens</title>

  <style>
    body {
      background:#0f172a;
      color:white;
      font-family:Arial;
      margin:0;
    }

    .container {
      max-width:1100px;
      margin:auto;
      padding:40px;
    }

    .hero {
      background:linear-gradient(135deg,#0d1b3a,#1e293b);
      padding:30px;
      border-radius:16px;
      margin-bottom:40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .subtitle {
      opacity:0.7;
      margin-top:6px;
    }

    .btn {
      padding:10px 18px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:bold;
      margin-left:8px;
    }

    .primary { background:#3b82f6; color:white; }
    .secondary { background:#1e293b; color:white; }

    .project-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:20px;
    }

    .project-card {
      background:#1e293b;
      padding:20px;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
    }

    .project-card:hover {
      background:#334155;
      transform:translateY(-4px);
    }

    .role-badge {
      font-size:12px;
      padding:4px 8px;
      border-radius:6px;
      margin-top:8px;
      display:inline-block;
    }

    .admin { background:#16a34a; }
    .member { background:#6366f1; }

    .invite-box {
      margin-top:15px;
      font-size:12px;
      opacity:0.8;
      word-break:break-all;
    }

    .empty-state {
      text-align:center;
      margin-top:80px;
      opacity:0.8;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hero">
    <div>
      <h1 id="welcomeText">Welcome 👋</h1>
      <p class="subtitle">
        Manage teams. Track work. Stay in control.
      </p>
    </div>

    <div>
      <button class="btn primary" onclick="createProject()">+ New Project</button>
    </div>
  </div>

  <h2>Your Workspaces</h2>

  <div id="projectsContainer" class="project-grid"></div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <h2>No Projects Yet</h2>
    <button class="btn primary" onclick="createProject()">
      Create First Project
    </button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyD3exFsBPPO6tCl5PgURMzgzGmg9nRhhCo",
  authDomain: "hirelens-studio.firebaseapp.com",
  projectId: "hirelens-studio"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;
let currentUserName;

/* ================= AUTH ================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  const userSnap = await getDoc(doc(db,"users",user.uid));
  currentUserName = userSnap.data().name;

  document.getElementById("welcomeText").innerText =
    `Welcome back, ${currentUserName} 👋`;

  checkInviteLink();
  loadProjects();
});

/* ================= LOAD PROJECTS ================= */

async function loadProjects(){

  const snapshot = await getDocs(collection(db,"projects"));

  const container = document.getElementById("projectsContainer");
  container.innerHTML = "";

  let hasProjects = false;

  snapshot.forEach(docSnap => {

    const data = docSnap.data();
    const members = data.members || {};

    if (members[currentUser.uid]) {

      hasProjects = true;

      const role = members[currentUser.uid].role;
      const inviteLink = `${window.location.origin}/main.html?invite=${data.inviteCode}`;

      container.innerHTML += `
        <div class="project-card"
             onclick="openProject('${docSnap.id}','${role}')">

          <h3>${data.name}</h3>

          <span class="role-badge ${role}">
            ${role}
          </span>

          ${role === "admin" ? `
            <div class="invite-box">
              Invite Link:<br>
              ${inviteLink}
            </div>
          ` : ""}

        </div>
      `;
    }
  });

  document.getElementById("emptyState").style.display =
    hasProjects ? "none" : "block";
}

/* ================= SMART REDIRECTION ================= */

window.openProject = function(projectId, role){

  if (role === "admin") {
    window.location.href = `admin.html?project=${projectId}`;
  } else {
    window.location.href = `dashboard.html?project=${projectId}`;
  }
};

/* ================= CREATE PROJECT ================= */

window.createProject = async function(){

  const name = prompt("Enter Project Name:");
  if (!name) return;

  const inviteCode = Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

  await addDoc(collection(db,"projects"),{
    name,
    createdBy: currentUser.uid,
    inviteCode,
    createdAt:new Date(),
    members:{
      [currentUser.uid]:{
        role:"admin",
        name:currentUserName
      }
    }
  });

  loadProjects();
};

/* ================= INVITE LINK JOIN ================= */

async function checkInviteLink(){

  const params = new URLSearchParams(window.location.search);
  const inviteCode = params.get("invite");

  if (!inviteCode) return;

  const q = query(
    collection(db,"projects"),
    where("inviteCode","==",inviteCode)
  );

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    alert("Invalid invite link");
    return;
  }

  snapshot.forEach(async (docSnap)=>{

    const data = docSnap.data();
    const members = data.members || {};

    if (!members[currentUser.uid]) {

      members[currentUser.uid] = {
        role:"member",
        name:currentUserName
      };

      await updateDoc(doc(db,"projects",docSnap.id),{
        members
      });

      alert("Successfully joined project 🎉");
    }
  });

  loadProjects();
}

</script>

</body>
</html>
