<!DOCTYPE html>
<html>
<head>
<title>HireLens Auth</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#0f1e44,#07122a);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* ===== CARD CONTAINER ===== */

.auth-wrapper{
  perspective:1000px;
}

.auth-card{
  width:350px;
  height:430px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .6s;
}

.auth-card.flip{
  transform:rotateY(180deg);
}

.auth-side{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  background:#0d1b3a;
  border-radius:16px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.auth-side h2{
  margin-bottom:20px;
}

.auth-side input{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border-radius:8px;
  border:none;
  background:#07122a;
  color:white;
}

.auth-side button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:white;
  cursor:pointer;
  margin-bottom:10px;
}

.google-btn{
  background:#ea4335;
}

.switch-text{
  text-align:center;
  font-size:13px;
  margin-top:10px;
  cursor:pointer;
  opacity:.8;
}

.back{
  transform:rotateY(180deg);
}
</style>
</head>

<body>

<div class="auth-wrapper">
  <div class="auth-card" id="authCard">

    <!-- LOGIN -->
    <div class="auth-side front">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <button class="google-btn" id="googleLogin">Login with Google</button>
      <div class="switch-text" onclick="flipCard()">Don't have account? Register</div>
    </div>

    <!-- REGISTER -->
    <div class="auth-side back">
      <h2>Register</h2>
      <form id="registerForm">
        <input type="text" id="registerName" placeholder="Full Name" required>
        <input type="email" id="registerEmail" placeholder="Email" required>
        <input type="password" id="registerPassword" placeholder="Password" required>
        <button type="submit">Register</button>
      </form>
      <button class="google-btn" id="googleRegister">Register with Google</button>
      <div class="switch-text" onclick="flipCard()">Already have account? Login</div>
    </div>

  </div>
</div>

<script type="module" src="auth.js"></script>

<script>
function flipCard(){
  document.getElementById("authCard").classList.toggle("flip");
}
</script>

</body>
</html>
